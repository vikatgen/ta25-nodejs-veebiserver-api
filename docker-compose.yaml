services:
  postgres:
    image: postgres:16-alpine
    container_name: ta25_node_veebirakendus
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ta25_node_veebirakendus
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: